services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-concord}
      POSTGRES_USER: ${POSTGRES_USER:-concord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - concord-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-concord} -d ${POSTGRES_DB:-concord}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - concord-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Bind to all interfaces inside the container; the host mapping below
      # decides what is actually reachable.
      HOST: 0.0.0.0
      PORT: 8080
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-10}
      # DATABASE_URL / REDIS_URL are assembled here from the POSTGRES_*/REDIS_*
      # values and pointed at the compose service names (not localhost). The
      # passwords are embedded into these URLs, so they must be URL-safe --
      # percent-encode any reserved characters (@ : / ? #) if you change them.
      DATABASE_URL: postgres://${POSTGRES_USER:-concord}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-concord}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PRESENCE_TTL_SECONDS: ${PRESENCE_TTL_SECONDS:-60}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URL: ${GITHUB_OAUTH_REDIRECT_URL:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-}
    ports:
      # REST API + WebSocket. Loopback-only by default, matching postgres/redis.
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    networks:
      - concord-net
    # The liveness check (GET /health) is baked into the image's HEALTHCHECK.

volumes:
  postgres-data:
  redis-data:

networks:
  concord-net:
